name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}

      - name: Check the tag matches the workspace version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'rh').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the workspace version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "resources-helper-$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/rh.exe, target/release/rhd.exe, target/release/rh-mcp.exe,
            README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "$name.zip.sha256"
          "ASSET=$name" >> $env:GITHUB_ENV

      - name: Extract release notes
        shell: bash
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { p = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET.zip" "$ASSET.zip.sha256" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
