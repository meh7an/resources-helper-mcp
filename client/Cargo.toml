[package]
name = "rh-client"
description = "HTTP client for the resources-helper daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rh-shared = { version = "0.1.0", path = "../shared" }
serde = "1.0.229"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
rh-core = { path = "../core" }
rhd = { path = "../daemon" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
