[package]
name = "rh-mcp"
description = "MCP server that lets Claude Code sessions lease CPU and GPU capacity from resources-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rh-client = { version = "0.1.0", path = "../client" }
rh-core = { version = "0.1.0", path = "../core" }
rh-sampler = { version = "0.1.0", path = "../sampler" }
rh-shared = { version = "0.1.0", path = "../shared" }
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
