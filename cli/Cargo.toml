[package]
name = "rh"
description = "CLI for resources-helper: status, leases, history, daemon control, install, and the PreToolUse hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rh-client = { version = "0.1.0", path = "../client" }
rh-core = { version = "0.1.0", path = "../core" }
rh-sampler = { version = "0.1.0", path = "../sampler" }
rh-shared = { version = "0.1.0", path = "../shared" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
