[package]
name = "rhd"
description = "resources-helper daemon: samples the machine and grants CPU and GPU leases to Claude Code sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
diesel = { version = "2.3.14", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
getrandom = "0.4.3"
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
rh-core = { version = "0.1.0", path = "../core" }
rh-sampler = { version = "0.1.0", path = "../sampler" }
rh-shared = { version = "0.1.0", path = "../shared" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
