[package]
name = "rh-sampler"
description = "Windows CPU, RAM, GPU, and VRAM sampling for resources-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
rh-core = { version = "0.1.0", path = "../core" }
rh-shared = { version = "0.1.0", path = "../shared" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
